# Checks every service, saves the results to site/data/, and publishes the website.
# Runs every 5 minutes, whenever code is pushed to the default branch, and on demand
# from the Actions tab. GitHub's scheduler can run late or stall; when it does, the
# "keepalive" job at the bottom starts the next check itself.
name: Monitor

on:
  schedule:
    # Minutes 2, 7, 12, … 57: GitHub's scheduler is busiest at the top of the hour.
    - cron: "2-59/5 * * * *"
  workflow_dispatch:
  push:
    paths-ignore:
      - "site/data/**"
      - "**.md"

permissions:
  contents: write # save results back to the repo
  pages: write # publish the website
  id-token: write # required by actions/deploy-pages

# One run at a time; a new run waits for the previous one instead of cancelling it.
concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  check:
    # Scheduled runs always use the default branch. Pushes to other branches don't publish.
    if: github.event_name != 'push' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      publish: ${{ steps.pages.outputs.publish }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Run tests
        if: github.event_name != 'schedule'
        run: npm test

      - name: Check every service
        id: check
        run: node scripts/check.mjs

      - name: Save results to the repo
        env:
          SUMMARY: ${{ steps.check.outputs.summary }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git commit --quiet -m "Status: ${SUMMARY:-update}"
          for attempt in 1 2 3 4; do
            if git pull --quiet --rebase origin "$GITHUB_REF_NAME" && git push --quiet origin "HEAD:$GITHUB_REF_NAME"; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done
          echo "::error::Couldn't save the results because the branch kept changing. The next run will try again."
          exit 1

      - name: Is GitHub Pages turned on?
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if out=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .build_type 2>&1); then
            if [ "$out" = "workflow" ]; then
              echo "publish=true" >> "$GITHUB_OUTPUT"
            else
              echo "publish=false" >> "$GITHUB_OUTPUT"
              echo "::warning title=Website not published::GitHub Pages is set to deploy from a branch. In Settings → Pages, set Source to \"GitHub Actions\"."
            fi
          elif echo "$out" | grep -q "404"; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Website not published yet::Turn on GitHub Pages in Settings → Pages → Source: \"GitHub Actions\". Status data is still being collected."
          else
            echo "Couldn't tell whether Pages is on ($out); trying to publish anyway."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Package the website
        if: steps.pages.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publish:
    needs: check
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

  # Backup timer. If GitHub's scheduler hasn't started a run in the last 12 minutes, wait
  # until ~5 minutes after this run began and start the next one. While the scheduler is
  # healthy this exits right away, so it never adds extra runs.
  keepalive:
    needs: [check, publish]
    if: always() && needs.check.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write # start the next run
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Start the next check if the scheduler is behind
        run: |
          runs="repos/$GITHUB_REPOSITORY/actions/workflows/monitor.yml/runs"
          scheduler_is_fine() {
            last=$(gh api "$runs?event=schedule&per_page=1" --jq '.workflow_runs[0].created_at // ""' 2>/dev/null || echo "")
            [ -n "$last" ] && [ $(( $(date -u +%s) - $(date -u -d "$last" +%s) )) -lt 720 ]
          }
          another_is_queued() {
            n=$(gh api "$runs?per_page=10" --jq "[.workflow_runs[] | select(.id != $GITHUB_RUN_ID and (.status == \"queued\" or .status == \"in_progress\" or .status == \"waiting\" or .status == \"pending\" or .status == \"requested\"))] | length" 2>/dev/null || echo 0)
            [ "$n" -gt 0 ]
          }
          if scheduler_is_fine; then echo "GitHub's scheduler is running normally."; exit 0; fi

          started=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .run_started_at 2>/dev/null || echo "")
          elapsed=$(( $(date -u +%s) - $(date -u -d "${started:-now}" +%s 2>/dev/null || date -u +%s) ))
          wait=$(( 290 - elapsed ))
          [ "$wait" -gt 280 ] && wait=280
          [ "$wait" -lt 60 ] && wait=60
          echo "Scheduler is behind; next check in ${wait}s."
          sleep "$wait"

          if scheduler_is_fine; then echo "The scheduler caught up."; exit 0; fi
          if another_is_queued; then echo "Another check is already queued."; exit 0; fi
          gh workflow run monitor.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
          echo "::notice title=Backup timer::GitHub's scheduler is behind, so this run started the next check."
